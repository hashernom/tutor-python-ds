[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tutor-diseno-software"
version = "0.1.0"
description = "Analizador estatico de defectos de diseno en programas Python"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
tutor-ds = "tutor_ds.cli:main"

[tool.setuptools.packages.find]
include = ["tutor_ds*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.coverage.run]
source = ["tutor_ds"]

[tool.coverage.report]
fail_under = 80
show_missing = true
